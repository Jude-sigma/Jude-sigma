name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: Jude-sigma
          outputs: |
            dist/snake.svg?palette=github-light&color_snake=7F5977&color_dots=BABABA,9b86a3,7F5977,5d4063,373A3F
            dist/snake-dark.svg?palette=github-dark&color_snake=7F5977&color_dots=373A3F,5d4063,7F5977,9b86a3,BABABA

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
